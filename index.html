<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Home</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">CampusShop</div>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="perfil.html">Perfil</a></li>
      </ul>
    </nav>
  </header>
  <main>

    <section class="busqueda">
      <input type="search" placeholder="Buscar productos...">
    </section>

    <section class="categorias">
      <h2>Categorías</h2>
      <div class="grid-categorias">
        <article class="categoria-card">Libros</article>
        <article class="categoria-card">Tecnología</article>
        <article class="categoria-card">Ropa</article>
        <article class="categoria-card">Accesorios</article>
      </div>
    </section>

    <section class="destacados">
      <h2>Productos destacados</h2>
      <div class="grid-productos">
        <article class="producto-card">
          <img src="img/auriculares.jpg" alt="Producto 1">
          <h3>Auriculares Inalámbricos</h3>
          <p>$50.000</p>
          <button>Agregar al carrito</button>
        </article>
        <article class="producto-card">
          <img src="img/hoddie.webp" alt="Producto 2">
          <h3>Hoddie Hombre</h3>
          <p>$75.000</p>
          <button>Agregar al carrito</button>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CampusShop </p>
  </footer>
</body>
</html>
