<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Inicio</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>


  <header class="header">
    <button class="icon-btn">
      <img src="img/logomenu.png" alt="Menú">
    </button>

    <h1 class="logo">CampusShop</h1>

    <button class="icon-btn cart-btn">
      <img src="img/logocarrito.png" alt="Carrito">
      <span class="badge">3</span>
    </button>
  </header>

  <main>


    <section class="search-section">
      <input type="search" placeholder="Buscar productos, marcas…">
    </section>


    <section class="categorias">
      <h2>Categorías Populares</h2>

      <div class="cat-grid">
        <div class="cat-card">
          <img src="img/logoabrigos.png" alt="Abrigos">
          <p>Abrigos</p>
        </div>

        <div class="cat-card">
          <img src="img/logo.png" alt="Camisetas">
          <p>Camisetas</p>
        </div>

        <div class="cat-card">
          <img src="img/logopantalones.png" alt="Pantalones">
          <p>Pantalones</p>
        </div>
      </div>
    </section>


    <section class="novedades">
      <h2>Novedades para ti</h2>

      <div class="prod-grid">

        <article class="prod-card">
          <img src="img/chaquetacuero.webp" alt="Chaqueta de Cuero">
          <h3>Chaqueta de Cuero</h3>
          <p class="precio">$140.000</p>
        </article>

        <article class="prod-card">
          <img src="img/camisetadepor.webp" alt="Camiseta Deportiva">
          <h3>Camiseta Deportiva</h3>
          <p class="precio">$45.000</p>
        </article>

        <article class="prod-card">
          <img src="img/jeans.webp" alt="Jeans Clásicos">
          <h3>Jeans Clásicos</h3>
          <p class="precio">$85.000</p>
        </article>

        <article class="prod-card">
          <img src="img/zapatillas.webp" alt="Zapatillas de Fútbol">
          <h3>Zapatillas de Fútbol</h3>
          <p class="precio">$75.000</p>
        </article>

      </div>
    </section>
    <a href="comparacion.html" class="btn">Comparación de productos</a>
  </main>

  <footer>
    <p>&copy; 2026 CampusShop</p>
  </footer>

</body>

</html>
