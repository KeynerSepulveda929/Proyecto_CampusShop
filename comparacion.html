<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparación técnica</title>
    <!-- <link rel="stylesheet" href="css/components.css"> 
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css"> -->
    <link rel="stylesheet" href="css/comparation.css"> 
</head>
<body>
    
    <main>
        <section class="producto-detalle">
          <img src="img/camisetaorgan.webp" alt="Camiseta Orgánica" class="prod-img">
          <h2>Camiseta Orgánica</h2>
          <p class="precio">$50.000</p>
          <p class="descripcion">
          </p>
    
          <div class="tallas">
            <label>Talla:</label>
            <button class="btn">S</button>
            <span class="tag">Disponible</span>
            <button class="btn active">M</button>
            <span class="tag">Disponible</span>
            <button class="btn">L</button>
            <span class="tag">No Disponible</span>
          </div>

          <div class="Material">
            <label>Material:</label>
            <span>Productos Orgánicos</span>

          </div>
    </main>

    <main>
        <section class="producto-detalle">
            <img src="img/camisetadepor.webp" alt="Camiseta Deportiva" class="prod-img">
            <h2>Camiseta Deportiva</h2>
            <p class="precio">$45.000</p>
            <p class="descripcion">
            </p>
      
            <div class="tallas">
              <label>Talla:</label>
              <button class="btn">S</button>
              <span class="tag">No Disponible</span>
              <button class="btn active">M</button>
              <span class="tag">No Disponible</span>
              <button class="btn">L</button>
              <span class="tag">Disponible</span>
            </div>
  
            <div class="Material">
              <label>Material:</label>
              <span>Tela Antitranspirable</span>
  
            </div>
    </main>

</body>
</html>
