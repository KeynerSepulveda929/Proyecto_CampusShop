<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Carrito</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">Mi Carrito (3)</h1>
  </header>

  <main>
    <section class="carrito-lista">

      <article class="carrito-item">
        <img src="img/prod-taza.png" alt="Taza de Cerámica">
        <div class="info">
          <h3>Taza de Cerámica Campus</h3>
          <p class="sku">#SKU12345</p>
          <div class="cantidad">
            <button>-</button>
            <span>1</span>
            <button>+</button>
          </div>
          <p class="subtotal">$12.50</p>
        </div>
        <button class="eliminar">🗑</button>
      </article>

      <article class="carrito-item">
        <img src="img/prod-sudadera.png" alt="Sudadera con Capucha Gris">
        <div class="info">
          <h3>Sudadera con Capucha Gris</h3>
          <p class="sku">#SKU67890</p>
          <div class="cantidad">
            <button>-</button>
            <span>1</span>
            <button>+</button>
          </div>
          <p class="subtotal">$45.00</p>
        </div>
        <button class="eliminar">🗑</button>
      </article>

      <article class="carrito-item">
        <img src="img/prod-mochila.png" alt="Mochila Resistente Negra">
        <div class="info">
          <h3>Mochila Resistente Negra</h3>
          <p class="sku">#SKU11223</p>
          <div class="cantidad">
            <button>-</button>
            <span>1</span>
            <button>+</button>
          </div>
          <p class="subtotal">$38.99</p>
        </div>
        <button class="eliminar">🗑</button>
      </article>

    </section>


    <section class="resumen">
      <p>Subtotal: <span>$96.49</span></p>
      <p>Impuestos: <span>$18.33</span></p>
      <p class="total">Total: <span>$114.82</span></p>
      <button class="btn pagar">Proceder al Pago</button>
    </section>
  </main>

</body>
</html>
