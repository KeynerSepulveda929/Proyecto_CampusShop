<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Carrito</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">Mi Carrito (3)</h1>
  </header>

  <main>
    <section class="carrito-lista">

      <article class="carrito-item">
        <img src="img/taza.webp" alt="Taza de Cerámica">
        <div class="info">
          <h3>Taza de Cerámica</h3>
          <p class="sku">#SKU12345</p>
          <div class="cantidad">
            <button>-</button>
            <span>1</span>
            <button>+</button>
          </div>
          <p class="subtotal">$40.000</p>
        </div>
        <button class="eliminar"></button>
      </article>

      <article class="carrito-item">
        <img src="img/sudadera.jpg" alt="Sudadera con Capucha Gris">
        <div class="info">
          <h3>Sudadera con Capucha Gris</h3>
          <p class="sku">#SKU67890</p>
          <div class="cantidad">
            <button>-</button>
            <span>1</span>
            <button>+</button>
          </div>
          <p class="subtotal">$60.000</p>
        </div>
        <button class="eliminar"></button>
      </article>

      <article class="carrito-item">
        <img src="img/mochila.jpg" alt="Mochila Negra">
        <div class="info">
          <h3>Mochila Negra</h3>
          <p class="sku">#SKU11223</p>
          <div class="cantidad">
            <button>-</button>
            <span>1</span>
            <button>+</button>
          </div>
          <p class="subtotal">$80.000</p>
        </div>
        <button class="eliminar"></button>
      </article>

    </section>


    <section class="resumen">
      <p>Subtotal: <span>$180.000</span></p>
      <p>Impuestos: <span>$25.000</span></p>
      <p class="total">Total: <span>$205.000</span></p>
      <button class="btn pagar">Proceder al Pago</button>
    </section>
  </main>

</body>
</html>
