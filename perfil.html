<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Perfil</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">Perfil</h1>
  </header>

  <main>
    <section class="perfil-info">
      <img src="img/avatar.webp" alt="Avatar" class="avatar">
      <h2>Ana Torres</h2>
      <p class="email">ana.torres@email.com</p>
    </section>

    <section class="perfil-opciones">
      <button class="btn-opcion">Mis Pedidos</button>

      <button class="btn-opcion">Configuración</button>
      <button class="btn-opcion cerrar">Cerrar Sesión</button>
    </section>
  </main>

  <nav class="navbar">
    <button class="nav-btn">Inicio</button>
    <button class="nav-btn">Categorías</button>
    <button class="nav-btn">Carrito</button>
    <button class="nav-btn">Favoritos</button>

</html>
