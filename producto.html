<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Detalle del Producto</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">Detalles del Producto</h1>
    <button class="icon-btn cart-btn">
      <img src="img/logocarrito.png" alt="Carrito">
      <span class="badge">3</span>
    </button>
  </header>

  <main>
    <section class="producto-detalle">
      <img src="img/prod-sudadera.png" alt="Sudadera Clásica" class="prod-img">

      <h2>Sudadera Clásica</h2>
      <p class="precio">$49.99</p>
      <p class="descripcion">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
      </p>

      <div class="tallas">
        <label>Talla:</label>
        <button class="btn">S</button>
        <button class="btn active">M</button>
        <button class="btn">L</button>
      </div>

      <button class="btn comprar">Agregar al carrito</button>
    </section>

    <section class="relacionados">
      <h2>Productos Relacionados</h2>
      <div class="prod-grid">
        <article class="prod-card">
          <img src="img/prod-camiseta.png" alt="Camiseta Básica">
          <h3>Camiseta Básica</h3>
          <p class="precio">$19.99</p>
        </article>

        <article class="prod-card">
          <img src="img/prod-gorra.png" alt="Gorra Universitaria">
          <h3>Gorra Universitaria</h3>
          <p class="precio">$24.99</p>
        </article>

        <article class="prod-card">
          <img src="img/prod-mochila.png" alt="Mochila">
          <h3>Mochila</h3>
          <p class="precio">$59.99</p>
        </article>
      </div>
    </section>
  </main>

</body>
</html>
