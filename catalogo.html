<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Catálogo</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <button class="icon-btn"><img src="img/buscar.png" alt="Buscar"></button>
    <h1 class="logo">Catálogo</h1>
    <button class="icon-btn cart-btn">
      <img src="img/logocarrito.png" alt="Carrito">
      <span class="badge">3</span>
    </button>
  </header>

  <main>
    <section class="filters">
      <button class="filter-btn">Talla</button>
      <button class="filter-btn">Color</button>
      <button class="filter-btn">Precio</button>
    </section>

    <section class="prod-grid">
      <article class="prod-card oferta">
        <img src="img/sudaderaclasica.webp" alt="Sudadera Clásica">
        <h3>Sudadera Clásica</h3>
        <p class="precio">$45.000</p>
        <span class="tag">Oferta</span>
      </article>

      <article class="prod-card stock">
        <img src="img/camisetaorgan.webp" alt="Camiseta Orgánica">
        <h3>Camiseta Orgánica</h3>
        <p class="precio">$50.000</p>
        <span class="tag">Poco Stock</span>
      </article>

      <article class="prod-card">
        <img src="img/gorra.avif" alt="Gorra Deportiva">
        <h3>Gorra Deportiva</h3>
        <p class="precio">$35.000</p>
      </article>

      <article class="prod-card stock">
        <img src="img/mochilaresis.jpg" alt="Mochila Resistente">
        <h3>Mochila Resistente</h3>
        <p class="precio">$120.000</p>
        <span class="tag">Poco Stock</span>
      </article>

      <article class="prod-card oferta">
        <img src="img/botella.webp" alt="Botella Reutilizable">
        <h3>Botella Reutilizable</h3>
        <p class="precio">$45.000</p>
        <span class="tag">Oferta</span>
      </article>

      <article class="prod-card">
        <img src="img/libreta.jpg" alt="Libreta Ecológica">
        <h3>Libreta Ecológica</h3>
        <p class="precio">$20.000</p>
      </article>
    </section>
  </main>

</body>
</html>
