<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Catálogo</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <button class="icon-btn"><img src="img/icon-search.svg" alt="Buscar"></button>
    <h1 class="logo">Catálogo</h1>
    <button class="icon-btn cart-btn">
      <img src="img/icon-cart.svg" alt="Carrito">
      <span class="badge">3</span>
    </button>
  </header>

  <main>
    <!-- Filtros -->
    <section class="filters">
      <button class="filter-btn">Talla</button>
      <button class="filter-btn">Color</button>
      <button class="filter-btn">Precio</button>
    </section>

    <!-- Grid de productos -->
    <section class="prod-grid">
      <article class="prod-card oferta">
        <img src="img/prod-sudadera.png" alt="Sudadera Clásica">
        <h3>Sudadera Clásica</h3>
        <p class="precio">$39.99</p>
        <span class="tag">Oferta</span>
      </article>

      <article class="prod-card stock">
        <img src="img/prod-camiseta.png" alt="Camiseta Orgánica">
        <h3>Camiseta Orgánica</h3>
        <p class="precio">$24.99</p>
        <span class="tag">Poco Stock</span>
      </article>

      <article class="prod-card">
        <img src="img/prod-gorra.png" alt="Gorra Deportiva">
        <h3>Gorra Deportiva</h3>
        <p class="precio">$19.99</p>
      </article>

      <article class="prod-card stock">
        <img src="img/prod-mochila.png" alt="Mochila Resistente">
        <h3>Mochila Resistente</h3>
        <p class="precio">$45.00</p>
        <span class="tag">Poco Stock</span>
      </article>

      <article class="prod-card oferta">
        <img src="img/prod-botella.png" alt="Botella Reutilizable">
        <h3>Botella Reutilizable</h3>
        <p class="precio">$15.50</p>
        <span class="tag">Oferta</span>
      </article>

      <article class="prod-card">
        <img src="img/prod-libreta.png" alt="Libreta Ecológica">
        <h3>Libreta Ecológica</h3>
        <p class="precio">$12.00</p>
      </article>
    </section>
  </main>

</body>
</html>
