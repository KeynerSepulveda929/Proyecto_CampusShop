<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShop - Historial de Pedidos</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">Mis Pedidos</h1>
  </header>

  <main>
    <section class="pedidos-lista">

      <article class="pedido-card">
        <h3>Pedido #1001</h3>
        <p>Fecha: 10/04/2026</p>
        <p>Estado: <span class="estado entregado">Entregado</span></p>
        <p>Total: $89.99</p>
        <button class="btn">Ver Detalles</button>
      </article>

      <article class="pedido-card">
        <h3>Pedido #1002</h3>
        <p>Fecha: 12/04/2026</p>
        <p>Estado: <span class="estado en-proceso">En proceso</span></p>
        <p>Total: $120.50</p>
        <button class="btn">Ver Detalles</button>
      </article>

      <article class="pedido-card">
        <h3>Pedido #1003</h3>
        <p>Fecha: 13/04/2026</p>
        <p>Estado: <span class="estado cancelado">Cancelado</span></p>
        <p>Total: $45.00</p>
        <button class="btn">Ver Detalles</button>
      </article>

    </section>
  </main>

</body>
</html>
